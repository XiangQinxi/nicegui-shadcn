# Build configuration for the documentation site.
#
# The API reference under `docs/api/` is generated by `sphinx.ext.autodoc`, which
# *imports* `nicegui_shadcn` to read its docstrings. The build machine therefore
# needs the package and its runtime dependencies — `nicegui` above all — and not
# just the Sphinx toolchain from `docs/requirements.txt`.
#
# Netlify installs a `requirements.txt` from the base directory on its own, and
# only that one. `pip install -e .` is what pulls in `nicegui`, reading the
# version range out of `pyproject.toml`, so the dependency list is not duplicated
# here and the reference always describes the `nicegui` the package declares.
#
# `base` is the repository root on purpose: Netlify looks for `netlify.toml` in
# the base directory, so a base of `docs/` would never see this file.

[build]
  base = "."
  command = "pip install -r docs/requirements.txt && pip install -e . && python -m sphinx -b html docs docs/_build/html"
  publish = "docs/_build/html"

[build.environment]
  # `requires-python` is >=3.10,<4.0. Pin it rather than trust the image default.
  PYTHON_VERSION = "3.12"
